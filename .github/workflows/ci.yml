name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --incremental false
      - run: pnpm lint
      - run: pnpm test

      - name: Prepare immutable Pages artifact
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "pages-release-$env:GITHUB_SHA"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $manifest = Join-Path $releaseRoot "pages-artifact.json"
          pnpm release:pages -- --prepare `
            --manifest $manifest `
            --external-root $releaseRoot `
            --execute --confirm prepare-pages-release
          "TORUDAKE_PAGES_ARTIFACT_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: pnpm release:preflight:offline

      - name: Upload reviewed Pages artifact
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: dist/cloudflare-pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # CI never receives Cloudflare, OpenAI or payment credentials. The separate
  # workflow_run preview pipeline consumes only this reviewed build artifact.
