<!doctype html>
<html lang="ja" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1117; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b1117; }
      .scene { position: absolute; inset: 0; overflow: hidden; background: #0b1117; will-change: opacity, transform; }
      #rain, #coast, #sunset { opacity: 0; }
      .scene img { width: 100%; height: 100%; object-fit: cover; will-change: transform; }
      .shade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(3, 9, 15, 0.04) 0%, rgba(3, 9, 15, 0) 52%, rgba(3, 9, 15, 0.11) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.4" data-width="1080" data-height="1920">
      <div id="rain" class="clip scene" data-start="0" data-duration="3.45" data-track-index="1" data-layout-allow-overflow>
        <img id="rain-photo" src="assets/rain-city.jpg" alt="" />
      </div>
      <div id="coast" class="clip scene" data-start="2.65" data-duration="4.5" data-track-index="2" data-layout-allow-overflow>
        <img id="coast-photo" src="assets/coast.jpg" alt="" />
      </div>
      <div id="sunset" class="clip scene" data-start="6.35" data-duration="4.05" data-track-index="3" data-layout-allow-overflow>
        <img id="sunset-photo" src="assets/sunset-city.jpg" alt="" />
      </div>
      <div id="finishing-shade" class="clip shade" data-start="0" data-duration="10.4" data-track-index="4"></div>
      <audio id="demo-narration" class="clip" data-start="0.55" data-duration="9.080125" data-track-index="0" src="assets/narration.wav" preload="auto"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });

      timeline.set("#rain", { opacity: 1 }, 0);
      timeline.fromTo("#rain", { scale: 1.015, x: -10, y: 18 }, { scale: 1.09, x: 14, y: -24, duration: 3.45, ease: "sine.inOut" }, 0);
      timeline.to("#rain", { opacity: 0, duration: 0.8, ease: "sine.inOut" }, 2.65);

      timeline.set("#coast", { opacity: 0 }, 0);
      timeline.to("#coast", { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 2.65);
      timeline.fromTo("#coast", { scale: 1.07, x: 20, y: 0 }, { scale: 1.02, x: -20, y: -12, duration: 4.5, ease: "sine.inOut" }, 2.65);
      timeline.to("#coast", { opacity: 0, duration: 0.8, ease: "sine.inOut" }, 6.35);

      timeline.set("#sunset", { opacity: 0 }, 0);
      timeline.to("#sunset", { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6.35);
      timeline.fromTo("#sunset", { scale: 1.015, x: 0, y: 8 }, { scale: 1.085, x: -18, y: -22, duration: 4.05, ease: "sine.inOut" }, 6.35);

      window.__timelines.main = timeline;
    </script>
  </body>
</html>
